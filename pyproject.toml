[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-replay"
version = "0.1.0"
description = "Turn an agent transcript into one self-contained, redacted HTML replay"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
agent-replay = "agent_replay.cli:main"

[tool.setuptools]
packages = ["agent_replay"]
